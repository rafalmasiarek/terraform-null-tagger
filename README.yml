name: terraform-null-tagger
repo_url: https://github.com/rafalmasiarek/terraform-null-tagger
license: MIT
logo: https://masiarek.pl/assets/img/tagger_static/tagger-c431ed2461f542585c65a57e0c03ba12-1200.webp

context:
  - |
    **Standardized naming and tagging for Terraform resources.**

    Computes a `name_prefix` and tag map from namespace, environment, owner,
    module origin, and predefined per-service tag sets. Pure logic, no
    resources of its own.

includes:
  - docs/usage.md
  - docs/terraform.md

